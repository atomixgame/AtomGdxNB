<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Orbit 1 Cyan Gradient -->
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Orbit 2 Blue Gradient -->
    <linearGradient id="orbitBlue" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#11998e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Orbit 3 Purple/Rose Gradient -->
    <linearGradient id="orbitPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff5858" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f857a6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Orbital Rings Group -->
  <g transform="translate(256, 256)" filter="url(#neonGlow)">
    <!-- Ring 1 (60 deg) -->
    <ellipse rx="180" ry="60" fill="none" stroke="url(#orbitCyan)" stroke-width="10" transform="rotate(-30)"/>
    <!-- Ring 2 (-60 deg) -->
    <ellipse rx="180" ry="60" fill="none" stroke="url(#orbitBlue)" stroke-width="10" transform="rotate(30)"/>
    <!-- Ring 3 (90 deg) -->
    <ellipse rx="180" ry="60" fill="none" stroke="url(#orbitPurple)" stroke-width="10" transform="rotate(90)"/>

    <!-- Orbital Electrons / Particles -->
    <circle cx="155" cy="-90" r="10" fill="#00f2fe" filter="url(#neonGlow)"/>
    <circle cx="-155" cy="90" r="10" fill="#00f2fe" filter="url(#neonGlow)"/>
    <circle cx="155" cy="90" r="10" fill="#38ef7d" filter="url(#neonGlow)"/>
    <circle cx="-155" cy="-90" r="10" fill="#38ef7d" filter="url(#neonGlow)"/>
    <circle cx="0" cy="-180" r="10" fill="#ff5858" filter="url(#neonGlow)"/>
    <circle cx="0" cy="180" r="10" fill="#f857a6" filter="url(#neonGlow)"/>

    <!-- Central Glowing Nucleus / LibGDX Gaming Atom -->
    <circle cx="0" cy="0" r="58" fill="url(#coreGlow)"/>
    
    <!-- Gaming Core Poly / Diamond -->
    <polygon points="0,-36 32,-10 20,32 -20,32 -32,-10" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <polygon points="0,-22 20,-6 12,20 -12,20 -20,-6" fill="#38bdf8" opacity="0.85"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>
</svg>
